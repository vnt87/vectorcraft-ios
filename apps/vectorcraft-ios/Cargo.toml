[package]
name = "vectorcraft-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "VectorCraft native iPadOS app runner"

[lib]
name = "vectorcraft_ios"
crate-type = ["staticlib", "rlib"]

# The workspace denies `unsafe`. Only the Apple-only bridge modules allow it (each unsafe block
# carries a SAFETY comment); everything else in this crate stays safe Rust.
[lints]
workspace = true

[dependencies]
vectorcraft-engine = { workspace = true }
vectorcraft-ui-egui = { workspace = true }
serde_json = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
# Already pinned by eframe; the safe UIKit window configuration.
winit = { version = "=0.30.13", default-features = false }

objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSURL", "NSString", "NSObject", "NSDictionary", "NSFileManager", "NSPathUtilities", "NSFileCoordinator", "NSFilePresenter", "NSOperation", "NSSet", "NSValue", "block2"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["std", "UIApplication", "UIWindow", "UIScene", "UISceneSession", "UISceneOptions", "UIWindowScene", "UIResponder", "UIViewController", "UIDocumentPickerViewController", "UIView", "UIEvent", "UITouch", "UIGestureRecognizer", "block2", "objc2-core-foundation", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTType"] }
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
