name: iPadOS IPA Release

on:
  push:
    tags:
      - 'v*-ipados.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'SemVer release tag (e.g. v0.24.1-ipados.20261125; leave blank to auto-generate)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned iPadOS IPA (VectorCraft)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APP_NAME: VectorCraft
      APP_SLUG: vectorcraft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine SemVer tag and artifact name
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            VER=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
            TAG="v${VER}-ipados.$(date -u +%Y%m%d)"
          fi
          IPA_NAME="${APP_SLUG}-${TAG}-unsigned.ipa"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Rust iOS device target
        run: |
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version
          xcodebuild -version

      - name: Build VectorCraft.app for iOS (unsigned Release)
        run: |
          xcodebuild \
            -project "packaging/ios/${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="${RUNNER_TEMP}/DerivedData/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "error: Expected app bundle not found at $APP_PATH" >&2
            ls -la "${RUNNER_TEMP}/DerivedData/Build/Products/Release-iphoneos" || true
            exit 1
          fi
          rm -rf "${RUNNER_TEMP}/ipa"
          mkdir -p "${RUNNER_TEMP}/ipa/Payload"
          cp -R "$APP_PATH" "${RUNNER_TEMP}/ipa/Payload/"
          (cd "${RUNNER_TEMP}/ipa" && zip -r -y "${GITHUB_WORKSPACE}/${{ steps.meta.outputs.ipa_name }}" Payload)
          shasum -a 256 "${{ steps.meta.outputs.ipa_name }}" > SHA256SUMS.txt
          ls -lh "${{ steps.meta.outputs.ipa_name }}" SHA256SUMS.txt

      - name: Upload IPA workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ipa_name }}
          path: |
            ${{ steps.meta.outputs.ipa_name }}
            SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          IPA="${{ steps.meta.outputs.ipa_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$IPA" SHA256SUMS.txt \
              --prerelease \
              --title "${APP_NAME} ${TAG} (iPadOS)" \
              --notes "Unsigned iPadOS Release build of **${APP_NAME}** (\`${TAG}\`), built on GitHub Actions (\`macos-latest\`) for sideloading (AltStore / SideStore / LiveContainer / TrollStore)."
          fi
